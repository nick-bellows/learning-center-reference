name: ci

on:
  push:
  pull_request:

# Least privilege: CI only reads the repository. No job needs write scopes.
permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lcr
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: lcr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lcr"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # With a real Postgres present, the store INTEGRATION test runs instead
      # of skipping — the skip never hides a break in CI.
      DATABASE_URL: postgres://lcr:ci-only@localhost:5432/lcr?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: race detector
        run: go test -race ./...
      - name: govulncheck (reachable vulnerabilities fail the build)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # The quickstart is a CLAIM the README makes; this job executes it verbatim
  # and asserts all three demo statuses render end to end (db -> api -> web).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: wait for the API to be ready (health includes a DB ping)
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 2
          done
          echo "API never became healthy"; exit 1
      - name: eligibility endpoint returns all three statuses
        run: |
          set -e
          curl -s http://localhost:8080/v1/members/11111111-1111-1111-1111-111111111111/eligibility | grep -q '"eligible"'
          curl -s http://localhost:8080/v1/members/22222222-2222-2222-2222-222222222222/eligibility | grep -q '"suspended"'
          curl -s http://localhost:8080/v1/members/33333333-3333-3333-3333-333333333333/eligibility | grep -q '"ineligible_lapsed"'
      - name: malformed id is a 400, unknown member a 404
        run: |
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/members/not-a-uuid/eligibility)" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/members/99999999-9999-9999-9999-999999999999/eligibility)" = "404"
      - name: credentials contract is served only to a scoped service token
        run: |
          set -euo pipefail
          API=http://localhost:8080
          SERVICE='Authorization: Bearer local-service-token'
          LEARNER='Authorization: Bearer local-learner-token'

          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/v1/members/demo%7Clearner/credentials")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$LEARNER" "$API/v1/members/demo%7Clearner/credentials")" = "403"
          curl -sf -H "$SERVICE" "$API/v1/members/demo%7Clearner/credentials" \
            | jq -e '.contract == "learning-center.credentials.v1" and .member.subject == "demo|learner" and .eligibility.status == "eligible" and .role_credentials[0].valid == true'
          curl -sf -H "$SERVICE" "$API/v1/members/demo%7Creferee-sam/credentials" \
            | jq -e '.eligibility.status == "suspended" and .holds[0].source == "safesport" and (.holds[0] | has("reason") | not)'
          curl -sf -H "$SERVICE" "$API/v1/members/demo%7Creferee-riley/credentials" \
            | jq -e '.eligibility.status == "ineligible_lapsed" and .role_credentials[0].valid == false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$SERVICE" "$API/v1/members/demo%7Cnobody/credentials")" = "404"
      - name: authenticated learner workflow is role-protected, ordered, and retry-safe
        run: |
          set -euo pipefail
          API=http://localhost:8080
          LEARNER='Authorization: Bearer local-learner-token'
          ADMIN='Authorization: Bearer local-admin-token'

          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/v1/courses")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$LEARNER" "$API/v1/admin/compliance")" = "403"

          COURSE_ID=$(curl -sf -H "$LEARNER" "$API/v1/courses" | jq -er '.courses[0].id')
          FIRST=$(curl -sf -X POST -H "$LEARNER" "$API/v1/courses/$COURSE_ID/enrollments")
          echo "$FIRST" | jq -e '.created == true and .enrollment.total_lessons == 3'
          ENROLLMENT_ID=$(echo "$FIRST" | jq -er '.enrollment.enrollment_id')
          LESSON_ONE=$(echo "$FIRST" | jq -er '.enrollment.lessons[0].id')
          LESSON_THREE=$(echo "$FIRST" | jq -er '.enrollment.lessons[2].id')

          RETRY=$(curl -sf -X POST -H "$LEARNER" "$API/v1/courses/$COURSE_ID/enrollments")
          echo "$RETRY" | jq -e '.created == false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$LEARNER" "$API/v1/enrollments/$ENROLLMENT_ID/lessons/$LESSON_THREE/complete")" = "409"

          COMPLETED=$(curl -sf -X POST -H "$LEARNER" "$API/v1/enrollments/$ENROLLMENT_ID/lessons/$LESSON_ONE/complete")
          echo "$COMPLETED" | jq -e '.recorded == true and .enrollment.percent_complete == 33'
          curl -sf -H "$LEARNER" "$API/v1/me/dashboard" | jq -e '.enrollments[0].completed_lessons == 1'
          curl -sf -H "$ADMIN" "$API/v1/admin/compliance" | jq -e '.members | length == 4'
      - name: web renders the live statuses
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/members > page.html && break
            sleep 2
          done
          set -e
          grep -q 'Riley Referee' page.html
          grep -q 'ineligible_lapsed' page.html
          grep -q 'suspended' page.html
          curl -sf http://localhost:3000/learn | grep -q 'Grassroots Match-Day Safety'
          curl -sf http://localhost:3000/admin/compliance | grep -q 'Casey Admin'
      - name: scoped demo reset clears mutable enrollment state
        run: |
          docker compose exec -T -e RESET_CONFIRM=synthetic-demo api /resetdemo
          test "$(docker compose exec -T -e PGPASSWORD=change-me-locally db psql -U lcr -d lcr -tAc 'select count(*) from enrollment')" = "0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install accessibility-test dependencies and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: WCAG A/AA automated checks on all five routes
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npm run test:a11y
      - name: stack logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - run: docker compose down -v
        if: always()

  oidc-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: start local standards-based OIDC stack
        run: docker compose -f compose.yml -f compose.oidc.yml up -d --build
      - name: wait for API and web
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health >/dev/null && curl -sf http://localhost:3000/ >/dev/null && exit 0
            sleep 2
          done
          echo "OIDC stack never became ready"; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install browser-test dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: exercise learner login, authorization denial, logout, and administrator login
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_OIDC: "1"
        run: npm run test:auth
      - name: read-only deployment smoke boundary
        run: python scripts/smoke_public_demo.py --app-url http://localhost:3000 --api-url http://localhost:8080 --issuer-host oidc.localhost:5556
      - name: scoped reset remains executable
        run: docker compose -f compose.yml -f compose.oidc.yml exec -T -e RESET_CONFIRM=synthetic-demo api /resetdemo
      - name: stack logs on failure
        if: failure()
        run: docker compose -f compose.yml -f compose.oidc.yml logs --tail 100
      - name: stop stack and remove synthetic state
        if: always()
        run: docker compose -f compose.yml -f compose.oidc.yml down -v

  # Secret scan over the full history, using the committed .gitleaks.toml allowlist.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history; fails the build on any finding)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --exit-code 2
