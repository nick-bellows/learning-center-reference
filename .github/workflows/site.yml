# Publishes docs/ as a static GitHub Pages tour: the walkthrough GIF, the two
# screenshots, and links into the code. Nothing is built; the application itself
# is not hosted. Every third-party action is pinned to a full commit SHA, as in ci.yml.
name: site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# One deploy at a time: a second push to main queues behind the running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
