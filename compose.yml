name: learning-center-reference

# `docker compose up --build` brings up the whole vertical slice from a clean
# clone with no .env required: Postgres, then the API (which applies its
# embedded migrations and the synthetic seed on startup), then the web app.
# Ports bind to 127.0.0.1 so nothing is exposed beyond your machine.
# Credentials here are local-only defaults, overridable via .env.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lcr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-lcr}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lcr}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy   # api waits until Postgres accepts connections
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://lcr:change-me-locally@db:5432/lcr?sslmode=disable}
      MIGRATE_ON_START: "1"          # apply embedded migrations at startup
      SEED_FILE: /seed.sql           # local demo data (synthetic, idempotent)
    volumes:
      - ./db/seed/seed.sql:/seed.sql:ro
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build: ./web
    depends_on:
      - api
    environment:
      # Server Components fetch the API server-side, inside the compose
      # network — so the base URL is the api service, not localhost.
      API_BASE_URL: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
